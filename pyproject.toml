[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-tickets-manager"
version = "0.1.0"
description = "Local IT helpdesk multi-agent CLI (LangGraph + OpenAI + Milvus)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.55",
  "langchain>=0.3.14",
  "langchain-openai>=0.3.0",
  "langchain-core>=0.3.28",
  "pymilvus[milvus_lite]>=2.4.0",
  "milvus-lite>=2.4.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
  "click>=8.1.7",
  "tenacity>=9.0.0",
]

[project.scripts]
it-helpdesk = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
